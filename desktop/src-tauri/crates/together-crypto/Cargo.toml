[package]
name = "mashiro-together-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/mashiro-music/mashiro-together-server"
authors = ["mashiro contributors"]

[lib]
name = "together_crypto"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
bip39 = { version = "2", features = ["rand"] }
chacha20poly1305 = "0.10"
data-encoding = "2"
ed25519-dalek = "2"
hkdf = "0.12"
rand = "0.8"
sha2 = "0.10"
